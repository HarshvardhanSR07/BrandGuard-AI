<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5430" />
      <stop offset="50%" stop-color="#143c22" />
      <stop offset="100%" stop-color="#0b2414" />
    </linearGradient>
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="coreCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bef264" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGrad)" stroke="#2e7041" stroke-width="1.2" />
  <rect x="3.2" y="3.2" width="41.6" height="41.6" rx="10.8" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.8" />

  <!-- Shield Facets -->
  <path d="M24 10 L13 15.5 V25.5 C13 32.5 17.5 37.8 24 40.5 V10 Z" fill="url(#leftWing)" fill-opacity="0.95" />
  <path d="M24 10 L35 15.5 V25.5 C35 32.5 30.5 37.8 24 40.5 V10 Z" fill="url(#rightWing)" />
  <line x1="24" y1="10" x2="24" y2="40.5" stroke="#0b2414" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Checkmark -->
  <path d="M18.5 24.5 L22.5 28.5 L29.5 20" stroke="url(#coreCheck)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Spark -->
  <path d="M24 7.2 L24.8 9.5 L27 10 L24.8 10.5 L24 12.8 L23.2 10.5 L21 10 L23.2 9.5 Z" fill="#bef264" />
